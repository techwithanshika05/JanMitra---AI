version: "3.9"

services:
  backend:
    build: ./backend
    container_name: janmitra-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./janmitra.db
      - CHROMA_DIR=./chroma_store
      - LLM_PROVIDER=none        # set to "gemini" or "openai" and add the API key below to enable generative answers
      - GEMINI_API_KEY=
      - OPENAI_API_KEY=
      - JWT_SECRET=change-this-in-production
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - VOICE_AGENT_NAME=${VOICE_AGENT_NAME:-janmitra-scheme-agent}
    volumes:
      - ./data:/app/data
      - backend_db:/app/db_store
    restart: unless-stopped

  voice-worker:
    build: ./backend
    container_name: janmitra-voice-worker
    command: ["python", "-m", "app.conversational_ai.agent.worker", "start"]
    environment:
      - DATABASE_URL=sqlite:///./janmitra.db
      - CHROMA_DIR=./chroma_store
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - VOICE_AGENT_NAME=${VOICE_AGENT_NAME:-janmitra-scheme-agent}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./data:/app/data
      - backend_db:/app/db_store
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: janmitra-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_db:
